        // Gemini Files API: large files are uploaded separately from the JSON prompt.
        // This avoids putting a large video into base64/inlineData.
        const GEMINI_UPLOAD_BASE = "https://generativelanguage.googleapis.com/upload/v1beta/files";
        const GEMINI_FILES_BASE = "https://generativelanguage.googleapis.com/v1beta/files";
        const MAX_CHUNK_SIZE = 8 * 1024 * 1024; // 8 MB chunks for stable tablet uploads.

        async function uploadToGeminiFiles(file, apiKey, onProgress) {
            const total = file.size;

            if (onProgress) onProgress(`Gemini Files API 업로드 준비 중... (${formatBytes(total)})`);

            // 1) Start resumable upload session.
            const startResponse = await fetch(`${GEMINI_UPLOAD_BASE}?key=${encodeURIComponent(apiKey)}`, {
                method: "POST",
                headers: {
                    "X-Goog-Upload-Protocol": "resumable",
                    "X-Goog-Upload-Command": "start",
                    "X-Goog-Upload-Header-Content-Length": String(total),
                    "X-Goog-Upload-Header-Content-Type": file.type || "application/octet-stream",
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    file: {
                        display_name: file.name.slice(0, 500)
                    }
                })
            });

            if (!startResponse.ok) {
                const msg = await startResponse.text();
                throw new Error(`Gemini 업로드 세션 생성 실패 (${startResponse.status}): ${msg.slice(0, 200)}`);
            }

            const uploadUrl =
                startResponse.headers.get("X-Goog-Upload-URL") ||
                startResponse.headers.get("x-goog-upload-url");

            if (!uploadUrl) {
                throw new Error("Gemini 업로드 주소를 받지 못했습니다. 브라우저의 네트워크 정책(CORS)을 확인해 주세요.");
            }

            // 2) Upload in resumable chunks. The video never becomes base64.
            let offset = 0;
            while (offset < total) {
                const end = Math.min(offset + MAX_CHUNK_SIZE, total);
                const chunk = file.slice(offset, end);

                const chunkResponse = await fetch(uploadUrl, {
                    method: "PUT",
                    headers: {
                        "Content-Length": String(chunk.size),
                        "X-Goog-Upload-Offset": String(offset),
                        "X-Goog-Upload-Command": end >= total ? "upload, finalize" : "upload"
                    },
                    body: chunk
                });

                if (!chunkResponse.ok) {
                    const msg = await chunkResponse.text();
                    throw new Error(`파일 업로드 실패 (${chunkResponse.status}): ${msg.slice(0, 200)}`);
                }

                offset = end;
                const percent = Math.round((offset / total) * 100);
                if (onProgress) {
                    onProgress(`Gemini에 영상 업로드 중... ${percent}% (${formatBytes(offset)} / ${formatBytes(total)})`);
                }
            }

            const fileInfo = await chunkResponseJsonSafe(chunkResponse);
            const uploadedFile = fileInfo.file || fileInfo;

            if (!uploadedFile.name) {
                throw new Error("Gemini가 업로드된 파일 정보를 반환하지 않았습니다.");
            }

            return uploadedFile;
        }

        async function chunkResponseJsonSafe(response) {
            const contentType = response.headers.get("content-type") || "";
            if (contentType.includes("application/json")) {
                return await response.json();
            }
            const text = await response.text();
            try {
                return JSON.parse(text);
            } catch {
                return {};
            }
        }

        function formatBytes(bytes) {
            if (!Number.isFinite(bytes) || bytes <= 0) return "0 B";
            const units = ["B", "KB", "MB", "GB"];
            const i = Math.min(Math.floor(Math.log(bytes) / Math.log(1024)), units.length - 1);
            return `${(bytes / Math.pow(1024, i)).toFixed(i === 0 ? 0 : 1)} ${units[i]}`;
        }

        async function waitForGeminiFileActive(fileName, apiKey, onProgress) {
            const cleanName = fileName.startsWith("files/") ? fileName.slice(6) : fileName;

            for (let attempt = 0; attempt < 120; attempt++) {
                const response = await fetch(
                    `${GEMINI_FILES_BASE}/${encodeURIComponent(cleanName)}?key=${encodeURIComponent(apiKey)}`
                );

                if (!response.ok) {
                    const msg = await response.text();
                    throw new Error(`업로드 파일 상태 확인 실패 (${response.status}): ${msg.slice(0, 200)}`);
                }

                const fileInfo = await response.json();
                const state = fileInfo.state || "ACTIVE";

                if (state === "ACTIVE") {
                    if (onProgress) onProgress("영상 처리가 완료되었습니다. Gemini가 발표를 분석하고 있습니다...");
                    return fileInfo;
                }

                if (state === "FAILED") {
                    throw new Error("Gemini가 영상을 처리하지 못했습니다. MP4 또는 MOV 형식으로 다시 녹화해 주세요.");
                }

                if (onProgress) {
                    onProgress(`Gemini가 영상 처리 중입니다... (${state})`);
                }

                await new Promise(resolve => setTimeout(resolve, 2500));
            }

            throw new Error("Gemini 영상 처리 시간이 너무 오래 걸렸습니다. 영상 길이를 줄여 다시 시도해 주세요.");
        }

                                                key={idx}
                                                onClick={() => setActiveQuestionIdx(idx)}
                                                className={`p-4 rounded-xl border text-xs cursor-pointer transition ${activeQuestionIdx === idx ? 'bg-indigo-600/20 border-indigo-500 text-white' : 'bg-slate-900/60 border-slate-800 text-slate-400 hover:text-slate-200'}`}>
                                                <div className="font-bold mb-1 text-indigo-400">질문 {idx + 1}</div>
                                                <p className="line-clamp-2">{q.question}</p>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* Active Question & Practice Interface */}
                                <div className="md:col-span-2 glass-card p-6 rounded-2xl flex flex-col justify-between gap-6">
                                    <div className="space-y-4">
                                        <div className="bg-slate-900 p-4 rounded-xl border border-slate-800">
                                            <span className="text-xs text-indigo-400 font-bold uppercase tracking-wider">선택된 예상 질문</span>
                                            <h3 className="text-base font-bold text-white mt-1">
                                                {reportData.expectedQuestions[activeQuestionIdx].question}
                                            </h3>
                                            <p className="text-xs text-slate-400 mt-2 bg-slate-800/80 p-2.5 rounded-lg border border-slate-700/50">
                                                💡 코치의 답변 팁: {reportData.expectedQuestions[activeQuestionIdx].tip}
                                            </p>
                                        </div>

                                        {/* Answer Input */}
                                        <div>
                                            <label className="block text-xs text-slate-400 mb-2">나의 답변 실전 연습</label>
                                            <textarea 
                                                rows="4"
                                                value={userQaAnswer}
                                                onChange={(e) => setUserQaAnswer(e.target.value)}
                                                placeholder="질문에 대해 어떻게 답변할지 적어보세요..."
                                                className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
                                            </textarea>
                                        </div>

                                        <button 
                                            onClick={handleAnswerQuestion}
                                            disabled={isSubmittingQa || !userQaAnswer.trim()}
                                            className="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs rounded-xl transition flex items-center justify-center gap-2 disabled:opacity-50">
                                            {isSubmittingQa ? (
                                                <span>AI 답변 피드백 분석 중...</span>
                                            ) : (
                                                <>
                                                    <Icon name="send" className="w-4 h-4" />
                                                    <span>답변 제출 및 AI 평가 받기</span>
                                                </>
                                            )}
                                        </button>
                                    </div>

                                    {/* History of Answer Feedbacks */}
                                    {qaHistory.length > 0 && (
                                        <div className="pt-4 border-t border-slate-800 space-y-3">
                                            <h4 className="text-xs font-semibold text-slate-400">연습한 답변 피드백 기록</h4>
                                            <div className="space-y-3 max-h-48 overflow-y-auto custom-scrollbar">
                                                {qaHistory.map((item, i) => (
                                                    <div key={i} className="bg-slate-900/80 p-3 rounded-xl border border-slate-800 text-xs space-y-1">
                                                        <p className="font-bold text-indigo-300">Q: {item.question}</p>
                                                        <p className="text-slate-300">A: {item.userAnswer}</p>
                                                        <div className="bg-indigo-950/40 p-2 rounded border border-indigo-800/40 text-indigo-200 text-[11px] mt-1">
                                                            {item.feedback}
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Footer */}
                    <footer className="mt-12 py-6 border-t border-slate-800 text-center text-xs text-slate-500">
                        <p>AI 발표 코치 웹앱 • Gemini Files API 대용량 업로드 & 멀티모달 발표 분석</p>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
